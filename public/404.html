<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const base = path.slice(0, path.lastIndexOf('/') + 1);
      const target = window.location.origin + base + 'index.html#' + path.slice(base.length - 1) + window.location.search;
      window.location.replace(target);
    </script>
  </head>
  <body></body>
</html>
